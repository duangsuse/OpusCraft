<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>goodMob · voxel filter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; --bg: #23262b; --panel: #1a1c20; --line: #343840; --fg: #d6d9de; --mute: #8a909a; --acc: #e0a458; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 380px; height: 100%; }
  #view { position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #status { position: absolute; left: 10px; bottom: 8px; color: var(--mute); font-variant-numeric: tabular-nums; pointer-events: none; }
  #status.err { color: #ff7b72; white-space: pre-wrap; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  select, input[type=text], textarea, button { background: #12141780; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; }
  input[type=text] { flex: 1; min-width: 0; font-family: ui-monospace, monospace; font-size: 12px; }
  input[type=color] { width: 26px; height: 22px; padding: 0; border: 1px solid var(--line); background: none; }
  button { cursor: pointer; } button:hover { border-color: var(--acc); }
  #drop { border: 1px dashed var(--line); border-radius: 6px; padding: 8px; color: var(--mute); text-align: center; }
  #drop.over { border-color: var(--acc); color: var(--fg); }
  .layer { display: grid; grid-template-columns: 26px 70px 1fr; gap: 6px; align-items: center; }
  .layer b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer small { color: var(--mute); }
  textarea { width: 100%; height: 180px; font: 11px/1.3 ui-monospace, monospace; resize: vertical; white-space: pre; }
  .warn { color: var(--acc); font-size: 12px; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<div id="app">
  <div id="view"><canvas id="c"></canvas><div id="status"></div></div>
  <aside>
    <h2>Source</h2>
    <div class="row">
      <select id="preset"></select>
      <input id="file" type="file" accept=".vox,.bbmodel,.json" hidden>
      <button id="pick">Open .vox / .bbmodel…</button>
    </div>
    <div id="drop">drop a .vox or Blockbench .bbmodel here</div>
    <div id="warn" class="warn"></div>

    <h2>View</h2>
    <div class="row">
      <label><input id="bypass" type="checkbox"> raw voxels (filter off)</label>
      <label><input id="edges" type="checkbox"> edges</label>
      <label><input id="wire" type="checkbox"> wireframe</label>
    </div>

    <h2>Base material (all layers)</h2>
    <div class="row"><input id="base" type="text" spellcheck="false"></div>

    <h2>Layers · Smooth Voxels material props</h2>
    <div id="layers"></div>

    <details><summary>SVOX text (paste into the Playground)</summary><textarea id="svox" readonly spellcheck="false"></textarea></details>
  </aside>
</div>
<script type="module" src="./src/main.js"></script>
