<!doctype html>
<!-- gode/tools/scview.html —— ScBridge 定长 TSV 的浏览器端查看器（pgviz 旁边的调试页，不依赖生成器 worker）。
     数据源：./out/scbridge-data.tsv（scserver.js 建的软链，指到 <游戏目录>/ScBridge/data.tsv）
             ./out/scbridge-resp.txt（最近一次请求的 id/规模/耗时）
     布局：行 = x9 z9 h10(.3) temp3 hum3 mount8(.3) shore10(.2) top5 id5 loaded2 \n = 65B；头 128B。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>SC bridge view</title>
<style>
  html, body { margin: 0; height: 100%; background: #101216; color: #d7dde5; font: 13px/1.5 ui-monospace, monospace; }
  #wrap { display: flex; height: 100%; }
  #side { width: 320px; padding: 12px 14px; border-right: 1px solid #2a2f38; overflow: auto; }
  #side h1 { font-size: 14px; margin: 0 0 8px; color: #9ecbff; }
  #side .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  #side .k { color: #7f8b99; }
  #side .warn { color: #ffb86b; }
  #side code { color: #9ecbff; }
  canvas { image-rendering: pixelated; display: block; margin: auto; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  #probe { position: absolute; left: 10px; bottom: 10px; background: #000a; padding: 6px 8px; border-radius: 4px; white-space: pre; }
  #legend { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px 8px; margin-top: 8px; font-size: 12px; }
  #legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="side">
    <h1>ScBridge 查看器</h1>
    <div id="info"><span class="warn">加载中…</span></div>
    <div id="legend"></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="probe">把鼠标移到地图上</div>
  </div>
</div>
<script type="module">
const HDR = 128, ROW = 65;
const COLORS = { 0: '#14161a', 1: '#2b2b2b', 2: '#8a5a3b', 3: '#8a6a52', 4: '#c9b27a', 6: '#7f7f7f', 7: '#d9cf98', 8: '#6aa84f', 18: '#2f5f9e', 61: '#eef2f5', 62: '#a8c8e0', 66: '#b9b6a8', 67: '#4a4a52', 72: '#9aa0a6' };
const NAMES = { 0: 'air', 1: 'bedrock', 2: 'dirt', 3: 'granite', 4: 'sandstone', 6: 'gravel', 7: 'sand', 8: 'grass', 18: 'water', 61: 'snow', 62: 'ice', 66: 'limestone', 67: 'basalt', 72: 'clay' };
const $ = (id) => document.getElementById(id);
const legend = $('legend');
for (const id of [18, 61, 62, 8, 3, 67, 2, 7, 4, 6, 72, 1]) {
  legend.insertAdjacentHTML('beforeend', `<span><i style="background:${COLORS[id]}"></i>${NAMES[id]}</span>`);
}

const cv = $('cv'), ctx = cv.getContext('2d');
let grid = null, size = 0, respText = '';

const LATIN1 = new TextDecoder('latin1');

function parse(buf) {
  const rows = [];
  const n = size * size;
  const text = LATIN1.decode(buf);           // 浏览器没有 Buffer：latin1 解码 = 字节 1:1 字符
  for (let i = 0; i < n; i++) {
    const off = HDR + i * ROW;
    const s = text.slice(off, off + ROW - 1);
    rows.push({
      x: +s.slice(0, 9), z: +s.slice(9, 18), h: +s.slice(18, 28), temp: +s.slice(28, 31), hum: +s.slice(31, 34),
      mountain: +s.slice(34, 42), shore: +s.slice(42, 52), top: +s.slice(52, 57), id: +s.slice(57, 62), loaded: s.slice(62, 64).trim() === '1'
    });
  }
  return rows;
}

function draw() {
  const px = Math.max(1, Math.min(6, Math.floor(900 / size)));
  cv.width = cv.height = size * px;
  const img = ctx.createImageData(size, size);
  const at = (i, j) => grid[Math.max(0, Math.min(size - 1, j)) * size + Math.max(0, Math.min(size - 1, i))];
  for (let j = 0; j < size; j++) {
    for (let i = 0; i < size; i++) {
      const r = grid[j * size + i];
      const c = COLORS[r.id] ?? '#808080';
      // 简单西北向山体阴影：高度梯度越大越亮/越暗
      const slope = (at(i - 1, j - 1).top - at(i + 1, j + 1).top) * 0.5 + (at(i - 1, j + 1).top - at(i + 1, j - 1).top) * 0.3;
      const k = Math.max(0.55, Math.min(1.45, 1 + slope * 0.05));
      const rgb = [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
      const o = (j * size + i) * 4;
      img.data[o] = Math.min(255, rgb[0] * k);
      img.data[o + 1] = Math.min(255, rgb[1] * k);
      img.data[o + 2] = Math.min(255, rgb[2] * k);
      img.data[o + 3] = 255;
    }
  }
  const tmp = document.createElement('canvas');
  tmp.width = tmp.height = size;
  tmp.getContext('2d').putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(tmp, 0, 0, cv.width, cv.height);
}

async function load() {
  try {
    const resp = await (await fetch(`./out/scbridge-resp.txt?t=${Date.now()}`)).text();
    const kv = Object.fromEntries(resp.trim().split(/\s+/).map((p) => { const i = p.indexOf('='); return i > 0 ? [p.slice(0, i), p.slice(i + 1)] : [p, '']; }));
    const sz = Number(kv.size);
    if (!(sz > 0)) throw new Error('resp 里没有 size');
    const buf = new Uint8Array(await (await fetch(`./out/scbridge-data.tsv?t=${Date.now()}`)).arrayBuffer());
    if (sz !== size || resp !== respText) {
      size = sz;
      grid = parse(buf);
      draw();
    }
    respText = resp;
    const tops = grid.map((r) => r.top);
    $('info').innerHTML = [
      ['请求 id', kv.id], ['中心', `${grid[0].x + (size - 1) / 2}, ${grid[0].z + (size - 1) / 2}`],
      ['规模', `${size}×${size}`], ['区块', `${kv.loaded}/${kv.total}`],
      ['耗时', `${kv.ms} ms`], ['顶高', `${Math.min(...tops)} .. ${Math.max(...tops)}`],
      ['文件字节', buf.length.toLocaleString()]
    ].map(([k, v]) => `<div class="row"><span class="k">${k}</span><span>${v}</span></div>`).join('');
  } catch (e) {
    $('info').innerHTML = `<div class="warn">读不到数据：${e.message}</div><div class="k">先跑 <code>node gode/tools/scserver.js</code>，再用 <code>node gode/tools/scbridge.js --x .. --z ..</code> 发一次请求</div>`;
  }
}

cv.addEventListener('mousemove', (ev) => {
  if (!grid) return;
  const rect = cv.getBoundingClientRect();
  const i = Math.floor((ev.clientX - rect.left) / rect.width * size);
  const j = Math.floor((ev.clientY - rect.top) / rect.height * size);
  if (i < 0 || j < 0 || i >= size || j >= size) return;
  const r = grid[j * size + i];
  $('probe').textContent = `(${r.x}, ${r.z})\ntop ${r.top} ${NAMES[r.id] ?? r.id}${r.loaded ? '' : ' (未加载)'}\nh ${r.h.toFixed(2)}  temp ${r.temp}  hum ${r.hum}\nmountain ${r.mountain.toFixed(3)}  shore ${r.shore.toFixed(1)}`;
});

load();
setInterval(load, 2500);
</script>
</body>
</html>
