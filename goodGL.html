    part([0, 0.75 - sneak * 0.3, 0], rotX(sneak * 2), [-0.25, 0, -0.125], [0.25, 0.75, 0.125], W, jacket);
    part([0, 0.75 - sneak * 0.3, 0], rotX(sneak * 2), [-0.26, 0.62, -0.135], [0.26, 0.75, 0.135], W, scarf);
    part([0, 0.75 - sneak * 0.3, 0], rotX(sneak * 2), [-0.26, 0.05, -0.135], [0.26, 0.12, 0.135], W, [60, 44, 30]);
    part([0.375, 1.375 - sneak * 0.5, 0], rotX(sw), [-0.125, -0.625, -0.125], [0.125, 0.125, 0.125], W, jacket);
    part([0.375, 1.375 - sneak * 0.5, 0], rotX(sw), [-0.126, -0.75, -0.126], [0.126, -0.6, 0.126], W, skin);
    part([-0.375, 1.375 - sneak * 0.5, 0], rotX(-sw), [-0.125, -0.625, -0.125], [0.125, 0.125, 0.125], W, jacket);
    part([-0.375, 1.375 - sneak * 0.5, 0], rotX(-sw), [-0.126, -0.75, -0.126], [0.126, -0.6, 0.126], W, skin);
    part([0.125, 0.75, sneak * 0.3], rotX(-sw), [-0.125, -0.75, -0.125], [0.125, 0, 0.125], W, pants);
    part([0.125, 0.75, sneak * 0.3], rotX(-sw), [-0.127, -0.75, -0.127], [0.127, -0.6, 0.127], W, boots);
    part([-0.125, 0.75, sneak * 0.3], rotX(sw), [-0.125, -0.75, -0.125], [0.125, 0, 0.125], W, pants);
    part([-0.125, 0.75, sneak * 0.3], rotX(sw), [-0.127, -0.75, -0.127], [0.127, -0.6, 0.127], W, boots);
  },
  buildHand(F, partial) {
    const B = this.HB; B.reset();
    if (this.thirdPerson || this.camOverride || this.hideHud || !this.player || this.panorama || this.player.dead || this.state !== 'play') { this.renderer.uploadDynamic(this.renderer.dynHand, B); return; }
    const p = this.player; const [sky, blk] = this.lightAt(p.x, p.y + p.eyeCur, p.z);
    let sp = this.swinging ? (this.swingTicks + partial) / 6 : 0; if (sp > 1) sp = 1;
    const equip = this.equipPrev + (this.equip - this.equipPrev) * partial;
    const held = this.inv.held;
    // bob in hand
    const bs = this.bobState || { f1: 0, f2: 0 }; const bx = Math.sin(bs.f1 * Math.PI) * bs.f2 * 0.5, by = -Math.abs(Math.cos(bs.f1 * Math.PI) * bs.f2);
    const sq = Math.sin(Math.sqrt(sp) * Math.PI), s2 = Math.sin(sp * sp * Math.PI), sq2 = Math.sin(Math.sqrt(sp) * Math.PI * 2);
    let eatOff = [0, 0, 0], eatRot = 0;
    if (this.eating > 0) { const e = (this.eating + partial); const k = Math.min(1, e / 6); eatOff = [-0.25 * k, 0.1 * k + Math.abs(Math.cos(e / 4 * Math.PI) * 0.1) * (e > 7 ? 1 : 0), 0.1 * k]; eatRot = 0.5 * k; }
    if (!held) {
      // bare arm (original simple sleeve design)
      const ox = 0.62 - 0.4 * sq + bx * 0.3, oy = -0.62 + 0.2 * sq2 - (1 - equip) * 0.6 + by * 0.3, oz = -0.75 - 0.2 * Math.sin(sp * Math.PI);
      let R = m3mul(rotX(-80 * DEG + sq * -40 * DEG), m3mul(rotZ(-25 * DEG + s2 * -10 * DEG), rotY(-20 * DEG + sq * 30 * DEG)));
      const skin = [214, 168, 132], jacket = [52, 84, 112];
      Models.box(B, [ox, oy, oz], R, [-0.11, -0.15, -0.11], [0.11, 0.55, 0.11], SH.TEX.white, 4, sky, blk, skin);
      Models.box(B, [ox, oy, oz], R, [-0.115, -0.5, -0.115], [0.115, -0.15, 0.115], SH.TEX.white, 4, sky, blk, jacket);
    } else {
      const kind = Models.itemKind(held.id); const isTool = SH.ITEMS[held.id].tool;
      const ox = 0.56 - 0.4 * sq + bx * 0.3 + eatOff[0], oy = -0.52 + 0.2 * sq2 - (1 - equip) * 0.6 + by * 0.3 + eatOff[1], oz = -0.72 - 0.2 * Math.sin(sp * Math.PI) + eatOff[2];
      let R = m3mul(rotY(45 * DEG), m3mul(rotY(s2 * -20 * DEG), m3mul(rotZ(sq * -20 * DEG), rotX(sq * -80 * DEG))));
      if (kind === 'block') {
        R = m3mul(rotY(45 * DEG), R);
        Models.item(B, held.id, [ox, oy + 0.05, oz], R, 0.34, sky, blk);
      } else {
        let R2 = isTool ? m3mul(rotZ(12 * DEG), m3mul(rotY(150 * DEG + eatRot), R)) : m3mul(rotY(150 * DEG + eatRot), R);
        if (isTool) R2 = m3mul(rotZ(0), R2);
        Models.item(B, held.id, [ox + 0.04, oy + 0.1, oz - 0.12], R2, 0.5, sky, blk);
      }
    }
    this.renderer.uploadDynamic(this.renderer.dynHand, B);
  },
};

(function () {
  const canvas = document.getElementById('game');
  const err = (msg) => { const d = document.getElementById('err'); d.style.display = 'flex'; d.textContent = msg; };
  window.addEventListener('error', (e) => { console.error(e.error || e.message); });
  Game.init(canvas).then(() => {
    const h = location.hash.slice(1); if (!h) return;
    const q = Object.fromEntries(h.split('&').map(s => s.split('=')));
    if ('nolock' in q) Game.noLock = true;
    if ('auto' in q) {
      if (q.shader !== undefined) Game.settings.shaders = q.shader === '1';
      if (q.rd) Game.settings.rd = +q.rd;
      if (q.scale) Game.renderScale = +q.scale;
      UI.open('loading');
      Game.startWorld({ name: 'auto-' + (q.seed || 1), seed: +(q.seed || 1), mode: q.mode ? +q.mode : 1 }).then(() => {
        if (q.x) { const p = Game.player; p.x = +q.x; p.z = +q.z; p.y = q.y ? +q.y : p.y; Game.spawnFound = !!q.y; }
        if (q.t) Game.time = +q.t;
        window.__autoq = q;
      });
    }
  }).catch(e => { console.error(e); err('启动失败：' + e.message); });
})();
